<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RescueConnect – Live GPS & Multi-Slide Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Leaflet CSS for Interactive Maps -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg:#e8f0ed;--panel:#f7faf8;--ink:#0f2a33;--mute:#5a7279;--line:#c3d3ce;--crit:#d8412f;--high:#e08a1f;--med:#2a8a7e;--water:#bcdbe4;--land:#dfe9e3;--accent:#0f2a33;--onaccent:#f7faf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b181d;--panel:#122429;--ink:#e3eeea;--mute:#8aa5ab;--line:#244048;--water:#143846;--land:#162d33;--accent:#e3eeea;--onaccent:#0b181d}}
:root[data-theme="dark"]{--bg:#0b181d;--panel:#122429;--ink:#e3eeea;--mute:#8aa5ab;--line:#244048;--water:#143846;--land:#162d33;--accent:#e3eeea;--onaccent:#0b181d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand small{color:var(--mute);display:block;font-size:12px}
.tabs,.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;transition:0.15s}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--med);outline-offset:2px}
button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
button.go{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:700}
.stats{display:flex;gap:0;border-bottom:1px solid var(--line)}
.stat{flex:1;padding:10px 20px;border-right:1px solid var(--line)}
.stat b{font:800 26px 'Bricolage Grotesque',sans-serif;display:block;line-height:1}
.stat span{color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);min-height:calc(100vh - 150px)}
.mapwrap{position:relative;border-right:1px solid var(--line)}
#map{width:100%;height:100%;min-height:380px;background:#0f172a;z-index:1}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;z-index:10}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.side{padding:16px 18px;overflow:auto;max-height:calc(100vh - 150px)}
.side h2{font-size:18px;margin-bottom:10px}
.q{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-left-width:5px;border-radius:8px;background:var(--panel);margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.q.sel{outline:2px solid var(--ink)}
.q .sc{font:800 22px 'Bricolage Grotesque',sans-serif}
.q small{color:var(--mute)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;margin:2px 4px 2px 0;background:var(--panel)}
.lvl-c{color:var(--crit);border-color:var(--crit)}.lvl-h{color:var(--high);border-color:var(--high)}.lvl-m{color:var(--med);border-color:var(--med)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px;margin:12px 0}
.steps{display:flex;gap:4px;margin:10px 0}
.steps div{flex:1;text-align:center;font-size:11px;padding:6px 2px;border-radius:6px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.steps div.d{background:var(--med);color:#fff;border-color:var(--med)}
textarea,input[type=number]{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{font-weight:700;font-size:13px;display:block;margin:10px 0 4px}
.bar{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .25s}
.note{color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:820px){main{grid-template-columns:1fr}.mapwrap{border-right:0;border-bottom:1px solid var(--line)}.side{max-height:none}.stat{padding:8px 10px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--crit)"/><path d="M17 7v20M7 17h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
    <div><h1>RescueConnect</h1><small>Live GPS Tracker & Multi-Slide Prototype</small></div>
  </div>
  <!-- Multi-Slide Deck Navigation -->
  <div class="tabs" role="tablist">
    <button id="s1Btn" class="on" onclick="setSlide(1)">Slide 1: Command Map</button>
    <button id="s2Btn" onclick="setSlide(2)">Slide 2: Citizen SOS App</button>
    <button id="s3Btn" onclick="setSlide(3)">Slide 3: Field Units</button>
    <button id="s4Btn" onclick="setSlide(4)">Slide 4: AI Analytics</button>
  </div>
  <div class="row">
    <button id="net" onclick="toggleNet()">Network: online</button>
    <button onclick="requestUserGPS()">📍 Locate Me (GPS)</button>
    <button onclick="wave()">Simulate wave</button>
  </div>
</header>
<div class="stats">
  <div class="stat"><b id="sOpen">0</b><span>Open requests</span></div>
  <div class="stat"><b id="sCrit" style="color:var(--crit)">0</b><span>Critical</span></div>
  <div class="stat"><b id="sTeams">0</b><span>Teams free</span></div>
  <div class="stat"><b id="sRes">0</b><span>Resolved</span></div>
</div>
<main>
  <div class="mapwrap" id="mapSection">
    <div id="map" role="img" aria-label="Live interactive rescue map"></div>
    <div class="legend"><span><i style="background:var(--crit)"></i>Critical</span><span><i style="background:var(--high)"></i>High</span><span><i style="background:var(--med)"></i>Medium</span><span><i style="background:var(--ink);border-radius:2px"></i>Rescue team</span></div>
  </div>
  <aside class="side" id="side"></aside>
</main>
<div class="toast" id="toast" role="status"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KW={trapped:30,rooftop:28,drowning:35,'water rising':28,collapsed:32,fire:30,unconscious:34,bleeding:30,heart:30,pregnant:24,insulin:24,oxygen:26,injured:22,flooded:20,child:14,children:14,baby:16,elderly:14,medical:18,stranded:16,medicine:12,'drinking water':10,food:8,shelter:8};
const SAMPLES=[['Water rising fast, family trapped on first floor with two children',6],['Elderly woman unconscious, needs oxygen, street is flooded',2],['Pregnant lady in labour, road blocked by water',3],['Need drinking water and food for the relief camp',25],['House collapsed, neighbours injured and bleeding',5],['Stranded on rooftop with insulin running out',4],['We need blankets and shelter for the night',12]];
const STEPS=['Submitted','Assigned','In progress','Resolved'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ai(text,n){const t=text.toLowerCase();let s=8,hits=[];for(const k in KW)if(t.includes(k)){s+=KW[k];hits.push(k)}const pb=Math.min(20,Math.round((n||1)*1.5));s=Math.min(99,s+pb);return{score:s,hits,pb,level:s>=80?'c':s>=55?'h':'m'}}
const COL={c:'var(--crit)',h:'var(--high)',m:'var(--med)'},NAME={c:'CRITICAL',h:'HIGH',m:'MEDIUM'};

const BASE_LAT = 13.0827, BASE_LNG = 80.2707;
let reqs=[], teams=[
  {id:'NDRF-1', lat: 13.0950, lng: 80.2500, busy:null},
  {id:'NDRF-2', lat: 13.0650, lng: 80.2900, busy:null},
  {id:'SDRF-1', lat: 13.0400, lng: 80.2500, busy:null},
  {id:'SDRF-2', lat: 13.1100, lng: 80.2800, busy:null},
  {id:'NGO-1',   lat: 13.0750, lng: 80.2300, busy:null}
];

let slide=1, sel=null, online=true, outbox=[], pin=null, mine=null, nid=1;
let userPosMarker = null, userAccuracyCircle = null;

const map = L.map('map', { zoomControl: false }).setView([BASE_LAT, BASE_LNG], 13);
L.control.zoom({ position: 'topright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

const markerLayers = {};
const teamLayers = {};
const routeLayers = {};

function add(text, n, lat, lng, age) {
  if (reqs.some(r => r.status < 3 && getDist({lat, lng}, r) < 0.5 && sim(r.text, text) > 0.6)) {
    toast('Duplicate detected — merged into existing request');
    return null;
  }
  const a = ai(text, n);
  const r = { id: nid++, text, n, lat, lng, ...a, status: 0, team: null, t: Date.now() - (age || 0) * 6e4 };
  reqs.push(r);
  return r;
}

function getDist(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function sim(a, b) {
  const A = new Set(a.toLowerCase().split(/\W+/)), B = new Set(b.toLowerCase().split(/\W+/));
  let i = 0; A.forEach(w => B.has(w) && i++);
  return i / new Set([...A, ...B]).size;
}

function toast(m) {
  const e = document.getElementById('toast');
  e.textContent = m; e.classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => e.classList.remove('show'), 2600);
}

function rnd(a, b) { return Math.round(a + Math.random() * (b - a)); }

function wave() {
  for(let i = 0; i < 3; i++) {
    const s = SAMPLES[rnd(0, SAMPLES.length - 1)];
    add(s[0], s[1], BASE_LAT + (Math.random() - 0.5) * 0.08, BASE_LNG + (Math.random() - 0.5) * 0.08, 0);
  }
  toast('3 new real-time GPS requests simulated');
  render();
}

function setSlide(n) {
  slide = n;
  ['s1Btn','s2Btn','s3Btn','s4Btn'].forEach((id, idx) => {
    document.getElementById(id).classList.toggle('on', idx + 1 == n);
  });
  
  const mapWrap = document.getElementById('mapSection');
  const mainGrid = document.querySelector('main');
  if (n == 4) {
    mapWrap.style.display = 'none';
    mainGrid.style.gridTemplateColumns = '1fr';
  } else {
    mapWrap.style.display = 'block';
    mainGrid.style.gridTemplateColumns = 'minmax(0, 1.5fr) minmax(300px, 1fr)';
    setTimeout(() => map.invalidateSize(), 100);
  }
  render();
}

function toggleNet() {
  online = !online;
  document.getElementById('net').textContent = 'Network: ' + (online ? 'online' : 'offline');
  if (online && outbox.length) {
    const k = outbox.length;
    outbox.forEach(o => {
      const r = add(o.text, o.n, o.lat, o.lng, 0);
      if (r && o.mine) mine = r;
    });
    outbox = [];
    toast(k + ' offline request(s) auto-synced via GPS network');
  }
  render();
}

function submit() {
  const txtBox = document.getElementById('txt');
  const pplBox = document.getElementById('ppl');
  const text = txtBox ? txtBox.value.trim() : '';
  const n = pplBox ? +pplBox.value || 1 : 1;
  
  if (!text) return toast('Describe the emergency first');
  if (!pin) return toast('Tap the map or use Locate Me to drop your GPS pin');
  
  if (!online) {
    outbox.push({ text, n, lat: pin.lat, lng: pin.lng, mine: 1 });
    toast('No network — saved on device, will sync automatically');
  } else {
    const r = add(text, n, pin.lat, pin.lng, 0);
    if (r) mine = r;
    toast('GPS Request broadcasted to command center');
  }
  pin = null;
  if(pinMarker) { map.removeLayer(pinMarker); pinMarker = null; }
  render();
}

function assign(r) {
  const free = teams.filter(t => !t.busy).sort((a, b) => getDist(a, r) - getDist(b, r))[0];
  if (!free) return toast('All teams busy — request stays queued');
  free.busy = r.id;
  r.team = free.id;
  r.status = 1;
  toast(free.id + ' dispatched (' + getDist(free, r).toFixed(1) + ' km away)');
  render();
}

function adv(r) {
  if (r.status < 3) {
    r.status++;
    if (r.status == 3) {
      const t = teams.find(t => t.id == r.team);
      if (t) t.busy = null;
    }
    render();
  }
}

let pinMarker = null;
map.on('click', e => {
  if (slide != 2) return;
  pin = { lat: e.latlng.lat, lng: e.latlng.lng };
  if (pinMarker) map.removeLayer(pinMarker);
  pinMarker = L.marker([pin.lat, pin.lng], {
    icon: L.divIcon({
      className: 'custom-pin',
      html: `<div style="background:#38bdf8;width:16px;height:16px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(56,189,248,0.8)"></div>`,
      iconSize: [16, 16]
    })
  }).addTo(map);
  render();
});

function requestUserGPS() {
  if (!navigator.geolocation) return toast('Geolocation is not supported by your browser');
  toast('Acquiring high-precision GPS signal...');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    pin = { lat, lng };
    map.setView([lat, lng], 15);
    
    if (userPosMarker) map.removeLayer(userPosMarker);
    if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);
    
    userAccuracyCircle = L.circle([lat, lng], { radius: accuracy, color: '#38bdf8', weight: 1, fillOpacity: 0.15 }).addTo(map);
    userPosMarker = L.marker([lat, lng], {
      icon: L.divIcon({
        className: 'user-gps',
        html: `<div style="background:#2563eb;width:18px;height:18px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px #2563eb"></div>`,
        iconSize: [18, 18]
      })
    }).addTo(map).bindPopup('<b>Your Live GPS Location</b>').openPopup();
    
    if (pinMarker) map.removeLayer(pinMarker);
    pinMarker = L.marker([lat, lng], {
      icon: L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#38bdf8;width:16px;height:16px;border:3px solid #fff;border-radius:50%;"></div>`,
        iconSize: [16, 16]
      })
    }).addTo(map);
    
    toast(`GPS locked successfully (Accuracy: ${Math.round(accuracy)}m)`);
    render();
  }, err => {
    toast('GPS access denied or unavailable. Click map manually.');
  }, { enableHighAccuracy: true });
}

function updateMapLayers() {
  for (const id in markerLayers) {
    map.removeLayer(markerLayers[id]);
    delete markerLayers[id];
  }
  for (const id in routeLayers) {
    map.removeLayer(routeLayers[id]);
    delete routeLayers[id];
  }

  reqs.filter(r => r.status < 3).forEach(r => {
    const color = COL[r.level];
    const isSelected = sel == r.id;
    const marker = L.circleMarker([r.lat, r.lng], {
      radius: r.level == 'c' ? 10 : r.level == 'h' ? 8 : 6,
      fillColor: color,
      color: isSelected ? '#fff' : '#0f2a33',
      weight: isSelected ? 3 : 2,
      fillOpacity: 0.9
    }).addTo(map);

    marker.bindPopup(`<b>Request #${r.id} (${NAME[r.level]})</b><br>${esc(r.text)}<br><small>Affected: ${r.n} people</small>`);
    marker.on('click', () => { sel = r.id; render(); });
    markerLayers[r.id] = marker;

    const t = teams.find(team => team.id == r.team);
    if (t && r.status > 0) {
      const line = L.polyline([[t.lat, t.lng], [r.lat, r.lng]], {
        color: 'var(--ink)',
        weight: 2,
        dashArray: '4, 4'
      }).addTo(map);
      routeLayers[r.id] = line;
    }
  });

  teams.forEach(t => {
    if (!teamLayers[t.id]) {
      const tMarker = L.marker([t.lat, t.lng], {
        icon: L.divIcon({
          className: 'team-icon',
          html: `<div style="background:var(--ink);color:var(--panel);font-weight:700;font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);white-space:nowrap">${t.id}</div>`,
          iconSize: [40, 20],
          iconAnchor: [20, 10]
        })
      }).addTo(map);
      teamLayers[t.id] = tMarker;
    } else {
      teamLayers[t.id].setLatLng([t.lat, t.lng]);
    }
  });
}

function stepper(r) {
  return `<div class="steps">${STEPS.map((s, i) => `<div class="${i <= r.status ? 'd' : ''}">${s}</div>`).join('')}</div>`;
}

function mins(r) { return Math.max(0, Math.round((Date.now() - r.t) / 6e4)); }

function slide1Panel() {
  const open = reqs.filter(r => r.status < 3).sort((a, b) => b.score - a.score);
  let h = '<h2>Slide 1: Command Dashboard & Map</h2><p class="note">Real-time triage queue and spatial incident overview.</p>' + (open.length ? '' : '<p class="note">No open requests. Use “Simulate wave”.</p>');
  const r = reqs.find(x => x.id == sel);
  
  if (r) {
    const nt = teams.filter(t => !t.busy).sort((a, b) => getDist(a, r) - getDist(b, r))[0];
    h += `<div class="card"><h3>Request #${r.id} <span class="chip lvl-${r.level}">${NAME[r.level]} · ${r.score}</span></h3><p>${esc(r.text)}</p><p class="note">${r.n} people · GPS: ${r.lat.toFixed(4)}, ${r.lng.toFixed(4)} · ${mins(r)}m ago</p>
    <div class="note" style="margin-top:8px">AI triage breakdown</div><div>${r.hits.map(k => `<span class="chip">${esc(k)} +${KW[k]}</span>`).join('') || '<span class="chip">no urgent keywords</span>'}<span class="chip">group size +${r.pb}</span></div>${stepper(r)}
    <div class="row">${r.status == 0 ? `<button class="go" onclick="assign(reqs.find(x=>x.id==${r.id}))">Dispatch ${nt ? nt.id + ' (' + getDist(nt, r).toFixed(1) + ' km)' : '— none free'}</button>` : ''}${r.status > 0 && r.status < 3 ? `<button onclick="adv(reqs.find(x=>x.id==${r.id}))">Mark ${STEPS[r.status + 1].toLowerCase()}</button>` : ''}</div></div>`;
  }
  return h + open.map(r => `<button class="q ${sel == r.id ? 'sel' : ''}" style="border-left-color:${COL[r.level]}" onclick="sel=${r.id};map.setView([${r.lat}, ${r.lng}], 15);render()"><span class="sc" style="color:${COL[r.level]}">${r.score}</span><span>${esc(r.text.slice(0, 70))}${r.text.length > 70 ? '…' : ''}<br><small>${NAME[r.level]} · ${r.n} people · ${STEPS[r.status]}${r.team ? ' · ' + r.team : ''}</small></span></button>`).join('');
}

function slide2Panel() {
  const txtVal = document.getElementById('txt') ? document.getElementById('txt').value : '';
  const pplVal = document.getElementById('ppl') ? document.getElementById('ppl').value : 1;
  const a = ai(txtVal, +pplVal);

  let h = `<h2>Slide 2: Citizen SOS App</h2><p class="note">Emergency form with browser GPS tracker and offline caching support.</p>
  <button onclick="requestUserGPS()" style="margin-bottom:10px;width:100%;background:#2563eb;color:#fff;font-weight:700;">📍 Auto-Detect My GPS Location</button>
  <label for="txt">What is happening?</label><textarea id="txt" rows="3" oninput="liveAi()" placeholder="e.g. Water rising, 2 children trapped on first floor">${esc(txtVal)}</textarea>
  <label for="ppl">People affected</label><input id="ppl" type="number" min="1" value="${pplVal}" oninput="liveAi()">
  <label>GPS Map Pin</label><p class="note">${pin ? `Pin set at Lat: ${pin.lat.toFixed(4)}, Lng: ${pin.lng.toFixed(4)}` : 'Click on the map or use Auto-Detect.'}</p>
  <div class="card" id="aibox"></div>
  <button class="go" onclick="submit()">${online ? 'Send emergency request' : 'Save offline on device'}</button>${outbox.length ? `<p class="note">${outbox.length} request(s) waiting in offline device queue</p>` : ''}`;
  
  if (mine) {
    h += `<div class="card"><h3>Your request #${mine.id}</h3>${stepper(mine)}<p class="note">${mine.team ? mine.team + ' is en route to your coordinates.' : 'Waiting for command center dispatch.'}</p></div>`;
  }
  return h;
}

function slide3Panel() {
  let h = '<h2>Slide 3: Field Units Telemetry</h2><p class="note">Live tracking of active NDRF, SDRF, and NGO rescue units.</p>';
  teams.forEach(t => {
    const assignedReq = reqs.find(r => r.id == t.busy);
    h += `<div class="card"><h3>${t.id} <span class="chip" style="background:${t.busy ? 'var(--crit)' : 'var(--med)'};color:#fff">${t.busy ? 'Busy (Req #' + t.busy + ')' : 'Available'}</span></h3>
    <p class="note">GPS Location: ${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}</p>
    ${assignedReq ? `<p><b>Assigned Task:</b> ${esc(assignedReq.text)}</p>` : '<p class="note">Standing by at base station.</p>'}</div>`;
  });
  return h;
}

function slide4Panel() {
  const total = reqs.length;
  const critCount = reqs.filter(r => r.level == 'c').length;
  const highCount = reqs.filter(r => r.level == 'h').length;
  const medCount = reqs.filter(r => r.level == 'm').length;
  const resCount = reqs.filter(r => r.status == 3).length;

  return `<h2>Slide 4: AI Triage Analytics & Report</h2><p class="note">Aggregated operational insights and keyword distribution metrics.</p>
  <div class="card"><h3>Operational Summary</h3>
    <p><b>Total Incidents Logged:</b> ${total}</p>
    <p><b>Resolved Incidents:</b> ${resCount}</p>
    <p><b>Severity Breakdown:</b> <span class="chip lvl-c">Critical: ${critCount}</span> <span class="chip lvl-h">High: ${highCount}</span> <span class="chip lvl-m">Medium: ${medCount}</span></p>
  </div>
  <div class="card"><h3>AI Keyword Weight Matrix</h3>
    <p class="note">Top weighted urgency triggers active in current incident stream:</p>
    <div><span class="chip">drowning +35</span><span class="chip">unconscious +34</span><span class="chip">collapsed +32</span><span class="chip">trapped +30</span><span class="chip">water rising +28</span></div>
  </div>`;
}

function liveAi() {
  const t = document.getElementById('txt').value, a = ai(t, +document.getElementById('ppl').value || 1);
  document.getElementById('aibox').innerHTML = aiHtml(a, t);
}

function aiHtml(a, t) {
  return `<div class="note">Live AI triage calculation</div><b style="color:${COL[a.level]}">${t ? NAME[a.level] + ' · ' + a.score : 'Waiting for description'}</b><div class="bar"><i style="width:${t ? a.score : 0}%;background:${COL[a.level]}"></i></div><div>${a.hits.map(k => `<span class="chip">${esc(k)}</span>`).join('')}</div>`;
}

function render() {
  const keep = document.activeElement && document.activeElement.id;
  const pos = keep && document.activeElement.selectionStart;
  
  const open = reqs.filter(r => r.status < 3);
  document.getElementById('sOpen').textContent = open.length;
  document.getElementById('sCrit').textContent = open.filter(r => r.level == 'c').length;
  document.getElementById('sTeams').textContent = teams.filter(t => !t.busy).length;
  document.getElementById('sRes').textContent = reqs.filter(r => r.status == 3).length;
  
  let sideHtml = '';
  if (slide == 1) sideHtml = slide1Panel();
  else if (slide == 2) sideHtml = slide2Panel();
  else if (slide == 3) sideHtml = slide3Panel();
  else if (slide == 4) sideHtml = slide4Panel();
  
  document.getElementById('side').innerHTML = sideHtml;
  if (slide == 2 && document.getElementById('txt')) liveAi();
  
  if (slide != 4) updateMapLayers();
  
  if (keep && document.getElementById(keep)) {
    const e = document.getElementById(keep);
    e.focus();
    try { e.setSelectionRange(pos, pos); } catch(_) {}
  }
}
